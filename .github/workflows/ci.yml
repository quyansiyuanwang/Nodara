name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (Nodara-Core)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Nodara-Core/target
          key: ${{ runner.os }}-core-${{ hashFiles('Nodara-Core/Cargo.lock') }}

      - name: Formatting
        working-directory: Nodara-Core
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: Nodara-Core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: Nodara-Core
        run: cargo test --workspace

      - name: Published schemas are up to date
        working-directory: Nodara-Core
        shell: pwsh
        run: |
          cargo run -q -p nodara-cli -- schema --out schema
          $drift = git status --porcelain schema
          if ($drift) {
            Write-Error "schema/ is stale; run 'cargo run -p nodara-cli -- schema --out schema'"
          }

      - name: Example workflows are valid
        working-directory: Nodara-Core
        shell: pwsh
        run: |
          cargo run -q -p nodara-cli -- validate ../examples/hello-world.json
          cargo run -q -p nodara-cli -- validate ../examples/delayed-log.json
          cargo run -q -p nodara-cli -- validate ../examples/branching.json
        # `examples/window-find.json` needs the platform plugin's node types,
        # and `examples/legacy/` is kept to exercise the migrator; neither is
        # valid against the plugin-less validation registry.

      - name: Build release artefacts
        working-directory: Nodara-Core
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: nodara-windows
          path: |
            Nodara-Core/target/release/nodara-cli.exe
            Nodara-Core/target/release/nodara-runtime.exe
            Nodara-Core/target/release/nodara-platform-plugin.exe
            Nodara-Core/target/release/nodara-vision-plugin.exe

  studio:
    name: Studio (Nodara-Studio)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nodara-Studio/package-lock.json

      - name: Install
        working-directory: Nodara-Studio
        run: npm ci

      - name: Type-check and build
        working-directory: Nodara-Studio
        run: npm run build

      - name: Tests
        working-directory: Nodara-Studio
        run: npm test

  agent:
    name: Agent (Nodara-Agent)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Nodara-Agent/target
          key: ${{ runner.os }}-agent-${{ hashFiles('Nodara-Agent/Cargo.lock') }}

      - name: Formatting
        working-directory: Nodara-Agent
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: Nodara-Agent
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: Nodara-Agent
        run: cargo test --workspace
