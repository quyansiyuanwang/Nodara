name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Nodara-Studio/package-lock.json
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            Nodara-Core
            Nodara-Agent
            Nodara-Studio/src-tauri
      - name: Linux native libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libdbus-1-dev libssl-dev libxkbcommon-dev libxkbcommon-x11-dev
      - name: Version manifests agree
        shell: pwsh
        run: ./scripts/check-version.ps1
      - name: Install Studio dependencies
        working-directory: Nodara-Studio
        run: npm ci
      - name: Studio build
        working-directory: Nodara-Studio
        run: npm run build
      - name: Studio tests
        working-directory: Nodara-Studio
        run: npm test
      - name: Core and Agent
        shell: bash
        run: |
          for project in Nodara-Core Nodara-Agent; do
            (cd "$project" && cargo fmt --all -- --check && cargo clippy --locked --workspace --all-targets -- -D warnings && cargo test --locked --workspace)
          done
      - name: Verify schemas and run examples
        working-directory: Nodara-Core
        shell: bash
        run: |
          cargo run --locked -q -p nodara-cli -- schema --out schema
          test -z "$(git status --porcelain -- schema)"
          for example in hello-world delayed-log branching; do
            cargo run --locked -q -p nodara-cli -- validate "../examples/$example.json"
          done
      - name: Build desktop companion binaries
        shell: bash
        run: |
          cargo build --locked --release --workspace --manifest-path Nodara-Core/Cargo.toml
          cargo build --locked --release --manifest-path Nodara-Agent/Cargo.toml
      - name: Execute screenshot mail through the platform plugin
        working-directory: Nodara-Core
        run: cargo run --locked --release -q -p nodara-cli -- run ../examples/screenshot-mail.json --plugin-dir plugins --quiet
      - name: Desktop shell
        run: cargo test --locked --manifest-path Nodara-Studio/src-tauri/Cargo.toml
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: nodara-windows
          if-no-files-found: error
          path: |
            Nodara-Core/target/release/nodara-cli.exe
            Nodara-Core/target/release/nodara-runtime.exe
            Nodara-Core/target/release/nodara-platform-plugin.exe
            Nodara-Core/target/release/nodara-vision-plugin.exe
