name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: Core (RecognizerFramework)
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RecognizerFramework/target
          key: ${{ runner.os }}-core-${{ hashFiles('RecognizerFramework/Cargo.lock') }}

      - name: Formatting
        working-directory: RecognizerFramework
        run: cargo fmt --all -- --check

      - name: Clippy
        working-directory: RecognizerFramework
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        working-directory: RecognizerFramework
        run: cargo test --workspace

      - name: Published schemas are up to date
        working-directory: RecognizerFramework
        shell: pwsh
        run: |
          cargo run -q -p rf-cli -- schema --out schema
          $drift = git status --porcelain schema
          if ($drift) {
            Write-Error "schema/ is stale; run 'cargo run -p rf-cli -- schema --out schema'"
          }

      - name: Example workflows are valid
        working-directory: RecognizerFramework
        shell: pwsh
        run: |
          cargo run -q -p rf-cli -- validate ../examples/hello-world.json
          cargo run -q -p rf-cli -- validate ../examples/delayed-log.json
          cargo run -q -p rf-cli -- validate ../examples/branching.json

      - name: Build release artefacts
        working-directory: RecognizerFramework
        run: cargo build --release

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: recognizer-framework-windows
          path: |
            RecognizerFramework/target/release/rf-cli.exe
            RecognizerFramework/target/release/rf-runtime.exe
            RecognizerFramework/target/release/rf-platform-plugin.exe
            RecognizerFramework/target/release/rf-vision-plugin.exe

  studio:
    name: Studio (RecognizerFramework-Studio)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: RecognizerFramework-Studio/package-lock.json

      - name: Install
        working-directory: RecognizerFramework-Studio
        run: npm ci

      - name: Type-check and build
        working-directory: RecognizerFramework-Studio
        run: npm run build

      - name: Tests
        working-directory: RecognizerFramework-Studio
        run: npm test

  agent:
    name: Agent (RecognizerFramework-Agent)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            RecognizerFramework-Agent/target
          key: ${{ runner.os }}-agent-${{ hashFiles('RecognizerFramework-Agent/Cargo.lock') }}

      - name: Formatting
        working-directory: RecognizerFramework-Agent
        run: cargo fmt --all -- --check

      - name: Tests
        working-directory: RecognizerFramework-Agent
        run: cargo test --workspace
