name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (must match the manifests), e.g. 2.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.platform }} ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x86_64
          - os: ubuntu-latest
            platform: linux
            arch: x86_64
          - os: macos-15-intel
            platform: macos
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: Nodara-Studio/package-lock.json

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            Nodara-Core/target
            Nodara-Agent/target
            Nodara-Studio/src-tauri/target
          key: ${{ runner.os }}-${{ matrix.arch }}-release-${{ hashFiles('Nodara-Core/Cargo.lock', 'Nodara-Agent/Cargo.lock', 'Nodara-Studio/src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-release-

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            libssl-dev \
            patchelf \
            pkg-config

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $version = $env:GITHUB_REF_NAME -replace "^v", ""
          }
          else {
            $version = "${{ inputs.version }}"
          }
          if (-not $version) { throw "Could not resolve a release version" }
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "building Nodara $version for ${{ matrix.platform }} ${{ matrix.arch }}"

      - name: Verify version manifests
        shell: pwsh
        run: |
          $arguments = @{ Version = "${{ steps.version.outputs.version }}" }
          if ($env:GITHUB_REF_TYPE -eq "tag") {
            $arguments.Tag = $env:GITHUB_REF_NAME
            $arguments.RequireChangelog = $true
          }
          ./scripts/check-version.ps1 @arguments

      - name: Install frontend dependencies
        working-directory: Nodara-Studio
        run: npm ci

      - name: Core formatting
        working-directory: Nodara-Core
        run: cargo fmt --all -- --check

      - name: Agent formatting
        working-directory: Nodara-Agent
        run: cargo fmt --all -- --check

      - name: Core clippy
        working-directory: Nodara-Core
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Agent clippy
        working-directory: Nodara-Agent
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Published schemas are up to date
        working-directory: Nodara-Core
        shell: pwsh
        run: |
          cargo run -q -p nodara-cli -- schema --out schema
          $drift = git status --porcelain schema
          if ($drift) {
            $drift
            git --no-pager diff --stat -- schema
            git --no-pager diff -- schema
            throw "schema/ is stale; run 'cargo run -p nodara-cli -- schema --out schema'"
          }

      - name: Build and package
        shell: pwsh
        run: ./scripts/build-artifacts.ps1 -Configuration Release

      - name: Collect release assets
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $platform = "${{ matrix.platform }}"
          $arch = "${{ matrix.arch }}"
          $base = "artifacts/release"
          $archive = Get-ChildItem -LiteralPath $base -File |
            Where-Object { $_.Name -like "Nodara-$version-$platform-$arch.*" -and $_.Name -notlike "*.sha256" } |
            Select-Object -First 1
          if (-not $archive) { throw "no package archive was produced for $platform $arch" }

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item $archive.FullName release-assets/
          Copy-Item "$($archive.FullName).sha256" release-assets/
          $packageDir = Join-Path $base ([System.IO.Path]::GetFileNameWithoutExtension($archive.Name))
          if (-not (Test-Path -LiteralPath $packageDir)) {
            $packageDir = Get-ChildItem -LiteralPath $base -Directory |
              Where-Object { $_.Name -like "Nodara-$version-$platform-$arch*" } |
              Select-Object -First 1 -ExpandProperty FullName
          }
          if ($packageDir -and (Test-Path -LiteralPath (Join-Path $packageDir "installers"))) {
            Get-ChildItem -LiteralPath (Join-Path $packageDir "installers") -File |
              ForEach-Object { Copy-Item $_.FullName release-assets/ }
          }
          if ($packageDir -and (Test-Path -LiteralPath (Join-Path $packageDir "build-info.json"))) {
            Copy-Item (Join-Path $packageDir "build-info.json") "release-assets/Nodara-$version-$platform-$arch-build-info.json"
          }
          Get-ChildItem release-assets | Select-Object Name, Length

      - name: Verify packaged release
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $platform = "${{ matrix.platform }}"
          $arch = "${{ matrix.arch }}"
          $archive = Get-ChildItem -LiteralPath "artifacts/release" -File |
            Where-Object { $_.Name -like "Nodara-$version-$platform-$arch.*" -and $_.Name -notlike "*.sha256" } |
            Select-Object -First 1
          if (-not $archive) { throw "no package archive was produced for $platform $arch" }
          ./scripts/verify-package.ps1 -ZipPath $archive.FullName -Version $version -Commit "$env:GITHUB_SHA"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}-${{ matrix.arch }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 7

      - name: Summary
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          (@(
            "## Nodara $version — ${{ matrix.platform }} ${{ matrix.arch }}",
            "",
            "- commit: ``$env:GITHUB_SHA``",
            "- package verification: passed"
          ) -join "`n") >> $env:GITHUB_STEP_SUMMARY

  publish:
    name: Publish GitHub Release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          merge-multiple: true
          path: dist

      - name: Resolve version
        id: version
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace "^v", ""
          "version=$version" >> $env:GITHUB_OUTPUT

      - name: Generate checksums
        shell: pwsh
        run: |
          $lines = Get-ChildItem dist -File |
            Where-Object { $_.Name -ne "SHA256SUMS.txt" -and $_.Name -ne "release-notes.md" } |
            Sort-Object Name |
            ForEach-Object {
              $hash = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
              "$hash  $($_.Name)"
            }
          [System.IO.File]::WriteAllText(
            (Join-Path (Get-Location) "dist/SHA256SUMS.txt"),
            (($lines -join "`n") + "`n"),
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Generate release notes
        shell: pwsh
        run: ./scripts/release-notes.ps1 -Version "${{ steps.version.outputs.version }}" -AssetsPath dist -OutputPath dist/release-notes.md

      - name: Check for an existing release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v${{ steps.version.outputs.version }}"
          & gh release view $tag --json tagName 2>$null | Out-Null
          if ($LASTEXITCODE -eq 0) {
            throw "GitHub release $tag already exists; delete it before re-running"
          }
          # `gh` exits 1 when the release does not exist, and `pwsh -Command`
          # would propagate that as this step's exit code. The absence of a
          # release is the expected state here.
          exit 0

      - name: Create release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $tag = "v$version"
          $arguments = @($tag, "--title", "Nodara $version", "--notes-file", "dist/release-notes.md", "--verify-tag")
          if ($version -match "-") {
            $arguments += "--prerelease"
          }
          else {
            $arguments += "--latest"
          }
          $assets = @(Get-ChildItem dist -File | Where-Object { $_.Name -ne "release-notes.md" } | ForEach-Object { $_.FullName })
          & gh release create @arguments @assets
          if ($LASTEXITCODE -ne 0) { throw "gh release create failed" }

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.version.outputs.version }}"
          $release = & gh release view "v$version" --json tagName,isDraft,isPrerelease,assets,url | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw "gh release view failed" }
          if ($release.isDraft) { throw "release is still a draft" }
          if ($version -notmatch "-" -and $release.isPrerelease) { throw "release is marked prerelease" }

          $names = @($release.assets | ForEach-Object { $_.name })
          $expected = @(
            "Nodara-$version-windows-x86_64.zip",
            "Nodara-$version-windows-x86_64.zip.sha256",
            "Nodara-Studio-$version-x64-setup.exe",
            "Nodara-Studio-$version-x64.msi",
            "Nodara-$version-linux-x86_64.tar.gz",
            "Nodara-$version-linux-x86_64.tar.gz.sha256",
            "Nodara-$version-macos-aarch64.tar.gz",
            "Nodara-$version-macos-aarch64.tar.gz.sha256",
            "Nodara-$version-macos-x86_64.tar.gz",
            "Nodara-$version-macos-x86_64.tar.gz.sha256",
            "SHA256SUMS.txt"
          )
          $missing = @($expected | Where-Object { $names -notcontains $_ })
          if ($missing.Count -gt 0) { throw "release is missing: $($missing -join ', ')" }

          "release published: $($release.url)" >> $env:GITHUB_STEP_SUMMARY
          $names | ForEach-Object { "- $_" } >> $env:GITHUB_STEP_SUMMARY
