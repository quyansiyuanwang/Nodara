[workspace]
members = ["crates/nodara-agent"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Nodara Contributors"]
rust-version = "1.75"
repository = "https://github.com/your-org/Nodara-Agent"

[workspace.dependencies]
# The agent depends on the *published contract*, never on runtime internals.
nodara-schema = { path = "../Nodara-Core/crates/nodara-schema" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
thiserror = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
ureq = { version = "2.10", features = ["json"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[workspace.lints.rust]
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
