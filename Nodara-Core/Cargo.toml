[workspace]
members = [
    "crates/nodara-schema",
    "crates/nodara-core",
    "crates/nodara-plugin",
    "crates/nodara-runtime",
    "crates/nodara-platform",
    "crates/nodara-vision",
    "crates/nodara-cli",
    "crates/nodara-testkit",
]
default-members = ["crates/nodara-cli"]
resolver = "2"

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
authors = ["Nodara Contributors"]
rust-version = "1.75"
repository = "https://github.com/your-org/Nodara-Core"

[workspace.dependencies]
# --- serialization / schema ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22"
schemars = "0.8"

# --- errors / diagnostics ---
thiserror = "1.0"
anyhow = "1.0"

# --- ids ---
uuid = { version = "1.0", features = ["v4", "serde"] }

# --- cli ---
clap = { version = "4.5", features = ["derive", "env"] }

# --- async runtime / http ---
tokio = { version = "1.40", features = [
    "rt-multi-thread",
    "macros",
    "sync",
    "time",
    "net",
    "io-util",
    "io-std",
    "process",
    "signal",
] }
axum = { version = "0.8", features = ["ws", "json", "tokio"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
futures-util = "0.3"
async-trait = "0.1"

# --- concurrency / logging ---
crossbeam-channel = "0.5"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# --- vision ---
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }


[workspace.lints.rust]
unsafe_code = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "allow", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
