[package]
name = "nodara-platform"
description = "Official Windows capability plugin: input, windows, screen capture, clipboard and processes"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "nodara_platform"
path = "src/lib.rs"

[[bin]]
name = "nodara-platform-plugin"
path = "src/bin/nodara-platform-plugin.rs"

[dependencies]
nodara-schema = { path = "../nodara-schema" }
nodara-core = { path = "../nodara-core" }
nodara-plugin = { path = "../nodara-plugin" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
image.workspace = true
dirs = "6"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "native-tls"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

# macOS and Linux share synthetic input and the clipboard.
[target.'cfg(unix)'.dependencies]
enigo = "0.6"
arboard = { version = "3.7", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
xcap = "0.9"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
x11rb = "0.13"

[lints]
workspace = true
