[package]
name = "nodara-runtime"
description = "Headless Nodara-Core runtime: HTTP/WebSocket API, run manager, policy and audit"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
rust-version.workspace = true

[lib]
name = "nodara_runtime"
path = "src/lib.rs"

[[bin]]
name = "nodara-runtime"
path = "src/bin/nodara-runtime.rs"

[dependencies]
nodara-schema = { path = "../nodara-schema" }
nodara-core = { path = "../nodara-core" }
nodara-plugin = { path = "../nodara-plugin" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
futures-util.workspace = true
tracing.workspace = true
parking_lot.workspace = true
uuid.workspace = true

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
