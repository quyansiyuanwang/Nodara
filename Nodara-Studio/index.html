<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nodara Studio</title>
  </head>
  <body>
    <div id="app" class="app">
      <header class="toolbar">
        <div class="toolbar__group">
          <strong class="brand">Nodara</strong>
          <span id="connection" class="connection connection--unknown" data-i18n="toolbar.connecting">connecting…</span>
          <button id="btn-language" class="btn btn--small" type="button" data-i18n-title="language.title">中文</button>
          <select id="theme-select" class="input input--small theme-select" aria-label="Theme"></select>
        </div>
        <div class="toolbar__group">
          <button id="btn-new" class="btn" data-i18n="actions.new">New</button>
          <button id="btn-import" class="btn" data-i18n="actions.import">Import</button>
          <button id="btn-export" class="btn" data-i18n="actions.export">Export</button>
          <button id="btn-undo" class="btn" data-i18n="actions.undo" disabled>Undo</button>
          <button id="btn-redo" class="btn" data-i18n="actions.redo" disabled>Redo</button>
          <button id="btn-validate" class="btn" data-i18n="actions.validate" disabled>Validate</button>
          <button
            id="validation-status"
            class="validation-status"
            type="button"
            data-state="unknown"
            aria-live="polite"
            title="Workflow has not been validated yet. Click to open Problems."
          >
            <span data-i18n="validation.notChecked">not checked</span>
          </button>
        </div>
        <div class="toolbar__group">
          <button id="btn-run" class="btn btn--primary" data-i18n="actions.run" disabled>Run</button>
          <button id="btn-run-options" class="btn" data-i18n="actions.runWithVariables" disabled>Variables…</button>
          <button id="btn-pause" class="btn" data-i18n="actions.pause" disabled>Pause</button>
          <button id="btn-resume" class="btn" data-i18n="actions.resume" disabled>Resume</button>
          <button id="btn-step" class="btn" data-i18n="actions.step" data-i18n-title="actions.stepDetail" disabled>Step</button>
          <button id="btn-cancel" class="btn" data-i18n="actions.cancel" disabled>Cancel</button>
        </div>
        <input id="file-input" type="file" accept="application/json" hidden />
      </header>

      <main class="workspace">
        <aside class="panel panel--palette">
          <h2 class="panel__title" data-i18n="palette.title">Nodes</h2>
          <input id="palette-filter" class="input" placeholder="Filter node types…" data-i18n-placeholder="palette.filter" />
          <div id="palette" class="palette"></div>
        </aside>

        <div id="resize-left" class="resizer resizer--vertical resizer--left" role="separator" aria-orientation="vertical" aria-label="Resize node palette" data-i18n-aria-label="resizer.palette" tabindex="0" title="Drag to resize. Double-click to reset." data-i18n-title="resizer.title"></div>

        <section class="canvas-wrap">
          <svg id="canvas" class="canvas">
            <defs>
              <marker id="arrow-control" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <path d="M0,0 L8,3.5 L0,7 z" fill="var(--edge-control)" />
              </marker>
              <marker id="arrow-data" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <path d="M0,0 L8,3.5 L0,7 z" fill="var(--edge-data)" />
              </marker>
              <marker id="arrow-success" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <path d="M0,0 L8,3.5 L0,7 z" fill="var(--edge-success)" />
              </marker>
              <marker id="arrow-failure" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="7" refX="8" refY="3.5" orient="auto">
                <path d="M0,0 L8,3.5 L0,7 z" fill="var(--edge-failure)" />
              </marker>
              <marker id="arrow-active" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="8" refX="9" refY="4" orient="auto">
                <path d="M0,0 L9,4 L0,8 z" fill="var(--edge-active)" />
              </marker>            </defs>
            <g id="viewport">
              <g id="edges" class="edges"></g>
              <g id="nodes" class="nodes"></g>
              <path id="pending-edge" class="edge edge--pending is-hidden" />
            </g>
          </svg>
          <div class="canvas-tools">
            <button id="canvas-zoom-out" class="canvas-tool" type="button" data-i18n-title="canvas.zoomOut">−</button>
            <button id="canvas-zoom-level" class="canvas-tool canvas-tool--wide" type="button" data-i18n-title="canvas.zoomReset">100%</button>
            <button id="canvas-zoom-in" class="canvas-tool" type="button" data-i18n-title="canvas.zoomIn">+</button>
            <button id="canvas-fit" class="canvas-tool canvas-tool--wide" type="button" data-i18n="canvas.fit">Fit</button>
            <button id="canvas-layout" class="canvas-tool canvas-tool--wide" type="button" data-i18n="canvas.autoLayout">Auto layout</button>
          </div>
          <div id="canvas-hint" class="canvas-hint" data-i18n="canvas.hint">
            Click to add at the centre, or drag a palette item to an exact canvas position. Drag from an output port to an input port to connect. Right-click or press Delete to remove the selected item.
          </div>
        </section>

        <div id="resize-right" class="resizer resizer--vertical resizer--right" role="separator" aria-orientation="vertical" aria-label="Resize properties panel" data-i18n-aria-label="resizer.properties" tabindex="0" title="Drag to resize. Double-click to reset." data-i18n-title="resizer.title"></div>

        <aside class="panel panel--inspector">
          <h2 class="panel__title" data-i18n="properties.title">Properties</h2>
          <div id="inspector" class="inspector">
            <p class="muted">Select a node to edit its configuration.</p>
          </div>
        </aside>
      </main>

      <div id="resize-drawer" class="resizer resizer--horizontal" role="separator" aria-orientation="horizontal" aria-label="Resize bottom panel" data-i18n-aria-label="resizer.drawer" tabindex="0" title="Drag to resize. Double-click to reset." data-i18n-title="resizer.title"></div>

      <section class="drawer">
        <nav id="drawer-tabs" class="drawer__tabs"></nav>
        <div id="panel-events" class="drawer__panel">
          <div class="events-toolbar">
            <input id="event-filter" class="input input--small" placeholder="Filter events…" data-i18n-placeholder="events.filter" />
            <label class="events-toolbar__follow">
              <input id="events-follow" type="checkbox" checked />
              <span data-i18n="events.follow">Follow</span>
            </label>
            <span id="events-count" class="events-toolbar__count"></span>
            <button id="events-clear" class="btn btn--small" type="button" data-i18n="events.clear">Clear</button>
          </div>
          <div id="events" class="events"></div>
        </div>
        <div id="panel-runs" class="drawer__panel" hidden>
          <div class="runs-toolbar">
            <input id="runs-filter" class="input input--small" placeholder="Filter runs…" data-i18n-placeholder="runs.filter" />
            <select id="runs-status" class="input input--small" aria-label="Run status">
              <option value="" data-i18n="runs.allStatuses">All statuses</option>
              <option value="pending" data-i18n="status.pending">Pending</option>
              <option value="running" data-i18n="status.running">Running</option>
              <option value="paused" data-i18n="status.paused">Paused</option>
              <option value="completed" data-i18n="status.completed">Completed</option>
              <option value="failed" data-i18n="status.failed">Failed</option>
              <option value="cancelled" data-i18n="status.cancelled">Cancelled</option>
            </select>
            <button id="runs-refresh" class="btn btn--small" data-i18n="actions.refresh">Refresh</button>
          </div>
          <div id="runs" class="runs"></div>
        </div>
        <div id="panel-extensions" class="drawer__panel" hidden>
          <div class="extensions-toolbar">
            <button id="extensions-refresh" class="btn btn--small" data-i18n="actions.refresh">Refresh</button>
          </div>
          <div id="extensions" class="extensions"></div>
        </div>
        <div id="panel-agent" class="drawer__panel" hidden>
          <div id="agent" class="agent"></div>
        </div>
        <div id="panel-audit" class="drawer__panel" hidden>
          <div class="audit-toolbar">
            <label class="muted">
              <input id="audit-current-run" type="checkbox" /> <span data-i18n="audit.currentRun">this run only</span>
            </label>
            <button id="audit-refresh" class="btn btn--small" data-i18n="actions.refresh">Refresh</button>
          </div>
          <div id="audit" class="audit"></div>
        </div>
        <div id="panel-problems" class="drawer__panel" hidden>
          <div id="problems" class="problems"></div>
        </div>
        <div id="panel-json" class="drawer__panel" hidden>
          <div class="json-toolbar">
            <span id="json-schema" class="muted"></span>
            <button id="btn-migrate-json" class="btn btn--small" data-i18n="actions.migrateJson">
              Migrate to 2.1
            </button>
            <button id="btn-runtime-schema" class="btn btn--small" data-i18n="actions.runtimeSchema">
              Point $schema at the runtime
            </button>
            <button id="btn-apply-json" class="btn" data-i18n="actions.applyJson">Apply JSON</button>
          </div>
          <textarea id="json-view" class="json" spellcheck="false"></textarea>
        </div>
      </section>
    </div>

    <dialog id="run-dialog" class="modal"></dialog>
    <dialog id="region-picker" class="modal region-picker"></dialog>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
