[package]
name = "recognizer-framework-studio"
version = "2.0.0"
description = "Desktop shell for RecognizerFramework Studio"
edition = "2021"
rust-version = "1.75"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
custom-protocol = ["tauri/custom-protocol"]
